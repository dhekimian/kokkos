# Build and test Kokkos' HIP backend on consumer AMD GPUs.
#
# Kokkos' AMD lanes are CDNA (MI300A, MI250, MI100). This adds RDNA: a Radeon
# 8060S (Strix Halo, gfx1151) and a Radeon AI PRO R9700 (gfx1201), each built
# for its own Kokkos_ARCH_AMD_* in the stock ROCm container and run through
# ctest, with the runtime gaps already known on RDNA filtered (#9179).
#
# Every run uploads summary-*.json (versions, device, pass/fail counts) so
# results compare across ROCm versions; other workflows call this one for a
# version matrix (workflow_call).
#
# Runners: AMD DevLab, a donated pool of ephemeral, single-use machines. One
# job per machine; nothing persists between jobs.
name: ROCm test (gfx1151, gfx1201)

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      image:
        description: ROCm container to build and test in
        default: rocm/dev-ubuntu-24.04:10.0.0-full
  workflow_call:
    inputs:
      image: {type: string, default: rocm/dev-ubuntu-24.04:10.0.0-full}
      label: {type: string, default: release}

permissions:
  contents: read

concurrency:
  group: rocm-test-${{ github.ref }}-${{ inputs.label || 'release' }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.gpu }} (${{ matrix.gfx }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - gpu: strix-halo
            gfx: gfx1151
            arch: AMD_GFX1151
            large_mem: "ON"       # unified memory: room for the 64-bit-extent views
          - gpu: radeon-r9700
            gfx: gfx1201
            arch: AMD_GFX1201
            large_mem: "OFF"
    runs-on: [self-hosted, Linux, devlab-dispatch, "${{ matrix.gpu }}"]
    timeout-minutes: 120
    env:
      IMAGE: ${{ inputs.image || 'rocm/dev-ubuntu-24.04:10.0.0-full' }}
      LABEL: ${{ inputs.label || 'release' }}
    steps:
      # The container runs as root; if an earlier job on this machine left
      # root-owned files in the workspace, checkout cannot delete them.
      - name: Clear root-owned files from an earlier job
        run: |
          if [ -n "$(find . -mindepth 1 ! -user "$(id -u)" -print -quit)" ]; then
            docker run --rm -v "$PWD:/w" "$IMAGE" find /w -mindepth 1 -delete
          fi

      - uses: actions/checkout@v4

      - name: Build and test in ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          docker pull -q "$IMAGE"
          docker run --rm --device=/dev/kfd --device=/dev/dri --group-add video \
            --security-opt seccomp=unconfined \
            -e ROCM_PATH=/opt/rocm -e HOST_IDS="$(id -u):$(id -g)" \
            -v "$PWD:/src" -w /src "$IMAGE" bash -euo pipefail -c '
              (command -v cmake >/dev/null && command -v git >/dev/null) || \
                (apt-get update -qq && apt-get install -y -qq cmake git >/dev/null)
              # Hand the workspace back to the runner user however this ends.
              trap "chown -R $HOST_IDS /src" EXIT
              # /src is owned by the runner user, not root: let git read it
              git config --global --add safe.directory "*"
              rocminfo > /tmp/rocminfo.txt 2>&1 || true
              grep -m1 -o "gfx[0-9a-f]*" /tmp/rocminfo.txt > /src/arch.txt || true
              # ROCM_PATH and the prefix let find_package(hip) work in images whose
              # hipcc is /usr/bin/hipcc (7.2.4-complete).
              cmake -S . -B build -DCMAKE_CXX_COMPILER=hipcc -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=/opt/rocm \
                -DKokkos_ENABLE_HIP=ON -DKokkos_ARCH_${{ matrix.arch }}=ON \
                -DKokkos_ENABLE_TESTS=ON -DKokkos_ENABLE_LARGE_MEM_TESTS=${{ matrix.large_mem }}
              cmake --build build -j8
              # Some ROCm images (10.0.0-full) do not register the HIP runtime with
              # ld.so, so the test binaries cannot load libamdhip64; point at it.
              hiplib=$(find -L /opt/rocm/ -name "libamdhip64.so*" -print -quit 2>/dev/null || true)
              echo "HIP runtime: ${hiplib:-not found}"
              ldconfig -p > /tmp/ldcache.txt
              if [ -n "$hiplib" ] && ! grep -q libamdhip64 /tmp/ldcache.txt; then
                export LD_LIBRARY_PATH="$(dirname "$hiplib")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
                echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
              fi
              /opt/rocm/bin/hipconfig --version > /src/hip.txt 2>/dev/null || true
              # Test failures do not fail this step; "Judge results" does, for new
              # ones. Keep failed tests full output: the judge reads gtest lines.
              rc=0
              (cd build && ctest --output-on-failure --timeout 300 \
                --test-output-size-failed 10000000 --output-junit /src/junit.xml) || rc=$?
              echo "$rc" > /src/ctest-rc.txt
            '

      - name: Judge results
        if: always()
        run: |
          python3 - <<'PY'
          import fnmatch, json, os, re, xml.etree.ElementTree as ET
          known = []
          for line in open(".github/devlab-known-failures.txt"):
              line = line.strip()
              if line and not line.startswith("#"):
                  pat, reason, issue = [f.strip() for f in line.split("|", 2)]
                  known.append((pat, reason, issue))
          def match(name):
              return next((k for k in known if fnmatch.fnmatchcase(name, k[0])), None)
          kf, nf, notes = [], [], []
          try:
              rc = int(open("ctest-rc.txt").read())
          except Exception:
              rc = None
          if rc not in (0, 8) or not os.path.exists("junit.xml"):
              nf.append(f"tests did not run (ctest rc={rc})")
          else:
              root = ET.parse("junit.xml").getroot()
              for tc in root.iter("testcase"):
                  if tc.find("failure") is None and tc.get("status") != "fail":
                      continue
                  name = tc.get("name")
                  out = "".join(e.text or "" for e in tc.iter("system-out"))
                  if match(name):
                      kf.append(name); notes.append((name, match(name)))
                      continue
                  # A gtest binary that ran to the end lists every failed case; if
                  # all of them are known, the ctest failure is known too.
                  cases = sorted(set(re.findall(r"^\[  FAILED  \] (\S+?)(?:,| \(|$)", out, re.M)))
                  finished = re.search(r"^\[==========\] \d+ tests? from \d+ test suites? ran", out, re.M)
                  if finished and cases and all(match(c) for c in cases):
                      for c in cases:
                          kf.append(f"{name}: {c}"); notes.append((f"{name}: {c}", match(c)))
                  else:
                      nf.append(name + (f" ({', '.join(c for c in cases if not match(c))})" if finished and cases else ""))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              for name, (pat, reason, issue) in notes:
                  print(f"::warning title=Known upstream failure::{name} — {reason} ({issue})")
                  out.write(f"- known upstream failure: `{name}` — {reason} ({issue})\n")
              for name in nf:
                  print(f"::error::new failure: {name}")
                  out.write(f"- NEW failure: `{name}`\n")
          verdict = "fail" if nf else "known-failures" if kf else "pass"
          json.dump({"verdict": verdict, "known_failures": kf, "new_failures": nf}, open("judge.json", "w"))
          print("verdict:", verdict)
          raise SystemExit(verdict == "fail")
          PY

      - name: Write the run summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, datetime, xml.etree.ElementTree as ET
          def read(p):
              try:
                  return open(p).read().strip()
              except Exception:
                  return None
          tests = None
          if os.path.exists("junit.xml"):
              s = ET.parse("junit.xml").getroot()
              s = s if s.tag == "testsuite" else s.find("testsuite")
              n = {k: int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
              tests = {"ran": n["tests"], "failed": n["failures"], "errors": n["errors"],
                       "skipped": n["skipped"],
                       "passed": n["tests"] - n["failures"] - n["errors"] - n["skipped"],
                       "seconds": round(float(s.get("time", 0)), 1)}
          try:
              judge = json.load(open("judge.json"))
          except Exception:
              judge = {"verdict": "fail", "known_failures": [], "new_failures": ["judge step did not run"]}
          summary = {
              "schema": 1, "project": "kokkos", "label": os.environ["LABEL"],
              "release": "${{ github.sha }}"[:12], "combo": os.environ["IMAGE"],
              "gpu": "${{ matrix.gpu }}", "gfx": "${{ matrix.gfx }}",
              "env": {"arch": read("arch.txt"), "hip": read("hip.txt"), "image": os.environ["IMAGE"]},
              "smoke": None, "tests": tests, "job_status": "${{ job.status }}",
              "verdict": judge["verdict"], "known_failures": judge["known_failures"],
              "new_failures": judge["new_failures"],
              "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "finished": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          json.dump(summary, open("summary.json", "w"), indent=1)
          print(json.dumps(summary, indent=1))
          PY

      - name: Upload the run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devlab-summary-${{ inputs.label || 'release' }}-${{ matrix.gpu }}-${{ github.run_attempt }}
          path: summary.json
          retention-days: 90
